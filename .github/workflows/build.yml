name: Build InsWallpaper EXE

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', 'DISCLAIMER.md', 'README.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyinstaller
          playwright install chromium

      - name: Download Real-ESRGAN (optional, best-effort)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-windows.zip" -OutFile r.zip
          Expand-Archive r.zip -DestinationPath r_extract
          if (Test-Path r_extract/realesrgan-ncnn-windows) {
            Move-Item r_extract/realesrgan-ncnn-windows realesrgan -Force
            Write-Host "Real-ESRGAN placed -> realesrgan/"
          } else {
            Write-Host "Real-ESRGAN layout unexpected, skipping super-resolution packaging"
          }

      - name: Build EXE
        run: python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsWallpaper
          path: dist/InsWallpaper.exe
          if-no-files-found: error
